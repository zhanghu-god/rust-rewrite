[package]
name = "portable-kit"
version = "0.1.0"
description = "Rust + Tauri 便携桌面应用公共能力：数据隔离与方案二自动更新"
authors = ["zhang"]
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
semver = "1"
chrono.workspace = true
base64 = "0.22"
