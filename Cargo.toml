[workspace]
resolver = "2"
members = [
    "crates/portable-kit",
    "push-wp/src-tauri",
    "ddl-desktop/src-tauri",
    "launch-manager/src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.77"
authors = ["zhang"]
license = "Apache-2.0"

# 集中管理跨项目共享的依赖版本，各成员用 `xxx.workspace = true` 引用，
# 需要额外 feature 时再叠加（如 push-wp 的 reqwest blocking）。
[workspace.dependencies]
portable-kit = { path = "crates/portable-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
semver = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
